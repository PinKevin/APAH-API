services:
  backend:
    container_name: apah_backend
    build:
      context: .
      target: production
      args:
        ENV_FILE: .env.production.local
    ports:
      - ${PORT}:${PORT}
      - 3333:3333
      - 9229:9229
    env_file:
      - .env.production.local
    volumes:
      - apah_storage:/home/node/app/storage
    command: >
      sh -c '
        # Check if .env exists
        if [ ! -f .env ]; then
          echo "Error: .env file not found!"
          exit 1
        fi

        # Check if APP_KEY exists in .env
        if ! grep -q "APP_KEY=" .env; then
          echo "Error: APP_KEY not set in .env!"
          exit 1
        fi

        # Run using pnpm
        exec pnpm start
      '
    depends_on:
      - postgresql

  postgresql:
    image: postgres:alpine
    container_name: apah_postgresql
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - ${DB_PORT}:${DB_PORT}
    expose:
      - ${DB_PORT}
    volumes:
      - apah_db:/var/lib/postgresql

volumes:
  apah_db:
  apah_storage:
